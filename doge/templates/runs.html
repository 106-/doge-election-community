{% extends 'base.html' %}{% block content %}<p class="eyebrow">ELECTION ARCHIVE</p><h1>実行一覧</h1><section class="card">{% for r in runs %}<a class="listrow" href="/runs/{{ r.id }}"><div><strong>{{ r.dataset_name }}</strong><small>{{ r.created }} · seed {{ r.seed }}</small></div><span class="badge">{{ statuses[r.status] }}</span><span>{{ r.winner or '—' }}</span></a>{% else %}<p class="muted">まだ実行がありません。データセットから選挙を始めてください。</p>{% endfor %}</section>{% endblock %}
